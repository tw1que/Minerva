services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: minerva
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: minerva
    ports:
      - "5432:5432"
    volumes:
      - minerva_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerva -d minerva"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://minerva:minerva@db:5432/minerva
      AUTO_CREATE_DB: "true"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  minerva_db:
